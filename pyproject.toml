[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "p2p-cop-agent"
dynamic = ["version"]
description = "Cop peer package for a distributed Cops-and-Robbers project"
readme = "README.md"
# 3.11 is the floor because the private per-peer config is TOML (book p. 131) and
# `tomllib` entered the standard library in 3.11. CI runs 3.12 and the course
# reference runs 3.13, so 3.10 was a support claim nothing ever exercised.
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Sharbel Maroun and contributors" }]
dependencies = [
    "fastmcp>=3.4.5,<4",
    "jsonschema>=4.23,<5",
]

[project.scripts]
p2p-cop = "p2p_cop_agent.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0,<10",
    "pytest-cov>=5.0,<8",
    "ruff>=0.9,<1",
]

[tool.hatch.version]
path = "src/p2p_cop_agent/shared/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/p2p_cop_agent"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
    "-p",
    "no:cacheprovider",
    "--cov=p2p_cop_agent",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=85",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = false
